name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.14.0'
        otp-version: '25.0'
    - name: Format code
      run: mix format
    - run: mix deps.get
    - run: mix format --check-formatted
    - run: mix test
